meta:
  name: shelbylevel
  link: https://www.shelbylevel.org

color:
  palette:
    deep-jade: "#254D56"
    faded-jade: "#45767a"
    faded-jade-50: "#a2bbbd"
    faded-jade-10: "#ecf1f2"
    gulfstream: "#7fa6ad"
    edgewater: "#d3dfdd"
    edgewater-20: "#dce5e4"
    cascade: "#b3c2c9"
    boulder: "#727E70"
    spring-rain: "#b2c5b4"
    timberwolf: "#D8D5CE"
    timberwolf-50: "#eceae7"
    almond-dust: "#B8AEA8"
    moonstone: "#969996"
    storm-cloud: "#64635E"
    plum-crazy: "#59224A"
  
  foreground: "#000000"         # main text color
  background: "#ffffff"         # background
  primary: "#45767a"            # primary brand color
  secondary: "#7fa6ad"          # secondary accent
  tertiary: "#a2bbbd"           # tertiary accent
  success: "#727E70"            # success states
  info: "#b2c5b4"               # info messages
  warning: "#B8AEA8"            # warnings
  danger: "#6f4a64"             # errors/danger
  light: "#ecf1f2"              # light backgrounds
  dark: "#64635E"               # dark elements

typography:
  fonts:
    - family: "Lato"
      source: google
      weight: [200, 300, 400, 600]
    - family: "Nunito Sans"
      source: google
      weight: [100, 300, 400, 600]
    - family: "Montserrat"
      source: google
      weight: [100, 200, 300, 400, 600]
  
  base:
    family: "Lato"
    size: "1rem"
    line-height: 1.6
    weight: 300
    color: foreground
  
  headings:
    family: "Nunito Sans"
    style: normal
    weight: 600
    line-height: 1.2
    color: primary
    text-transform: uppercase

defaults:
  bootstrap:
    # defaults: # defaults also supports a string as its value
    #   navbar-light-hover-color: $brand-faded_jade
  shiny:
    # defaults:
    #   navbar-light-hover-color: $brand-faded-jade
    theme:
      preset: shiny # base
      defaults:
        navbar-light-hover-color: $brand-faded-jade
      rules: | # CSS rules
        /* Remove flex from tab content */
        .tab-pane.html-fill-container {
          display: block !important;
        }

        /* Ensure inactive tabs are hidden */
        .tab-pane:not(.active) {
          display: none !important;
        }
      
        .tab-pane.active {
          display: block !important;
        }
      
        /* Remove equal-height rows in grid */
        .bslib-grid {
          grid-auto-rows: auto !important;
        }
      
        /* Remove gap spacing between grid items */
        .bslib-gap-spacing {
          gap: 0 !important;
        }
      
        /* Remove fixed heights, let cards expand naturally */
        .bslib-page-navbar .tab-content {
          height: auto !important;
          overflow-y: visible !important;
        }
      
        .card {
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
        }
      
        .card-body {
          height: auto !important;
          min-height: auto !important;
          overflow-y: visible !important;
        }
      
        /* Ensure page scrolls normally */
        body, html {
          height: auto;
          overflow-y: auto;
        }
      
        .bslib-page-navbar {
          height: auto !important;
          min-height: 100vh;
        }
        
        /*****************
        ANIMATED LOGO
        *****************/

        /* Master scale control — change this one value to resize the whole logo */
        .logo-wrapper {
          display: inline-block;
          font-size: clamp(0.6rem, 2cqw, 1rem); /* scales with container/viewport */
          width: 100%;
        }

        /* the line in the navbar logo - animation defined in ek-styles.css */
        .icon-line {
          display: block;
          background: $brand-faded-jade;
          width: 100%;
          height: 0.075em;
          margin: auto;
          margin-top: -0.1625em;
          margin-bottom: -0.1625em;
        }
      
        /* covers line inside of letter v */
        .icon-line2 {
          display: block;
          background: var(--bslib-navbar-light-bg);
          width: 14%;
          left: 43%;        /* (100% - 14%)/2 = 43% */
          height: 0.10625em;
          position: relative;
        }

        /* right inner square to smooth out where line and v meet */
        .icon-line2:after {
        content: "";
        position: absolute;
        width: 0.25em;
        height: 0.25em;
        transform: rotate(24deg);
        margin-left: 0.825em;
        margin-top: -0.075em;
        background-color: var(--bslib-navbar-light-bg);
        }

        /* left inner square to smooth out where line and v meet */
        .icon-line2:before {
        content: "";
        position: absolute;
        width: 0.25em;
        height: 0.25em;
        transform: rotate(336deg);
        margin-left: -0.05em;
        margin-top: -0.075em;
        background-color: var(--bslib-navbar-light-bg);
        }

        .first-name {
        font-family: "Nunito Sans";
        font-size: 1em;
        font-weight: 300;
        letter-spacing: 0.46em;
        margin-right: 0.4375em;
        }

        .v {
        font-family: "Nunito Sans";
        font-size: 1.5em;
        font-weight: 100;
        padding-right: 0.28125em;
        }

        /* navbar */
        .navbar-title {
        container-type: inline-size;
        font-family: "Nunito Sans";
        font-size: 1em;
        font-weight: 200;
        letter-spacing: 0.46em;
        color: $brand-faded-jade;
        }

        .last-name {
        font-family: "Nunito Sans";
        font-size: 1em;
        font-weight: 300;
        letter-spacing: 0.46em;
        padding-left: 0.5625em;
        }

        .last-name2 {
        font-family: "Nunito Sans";
        font-size: 1em;
        font-weight: 300;
        letter-spacing: 0.46em;
        margin-left: 0.3125em;
        }

        /*****************
        LOGO ANIMATION
        *****************/

        .bslib-nav-item:hover > .icon-line {
        animation-duration: 600ms;
        animation-name: line-expand;
        }

        @keyframes line-expand {
          from {
            width: 0%;
          }

          to {
            width: 100%;
          }
        }