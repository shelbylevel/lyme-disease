<svg id='logo-svg' viewBox='0 0 125 50' width='auto' height='50px' preserveAspectRatio='xMidYMid meet'>
  <defs>
    <style>
      .logo-color {
        fill: var(--brand-faded-jade, #45767a);
      }
      .line {
        transform-origin: center center;
        animation: none;
        stroke: var(--brand-faded-jade, #45767a);
      }
      svg:hover .line {
        animation: line-expand 700ms ease forwards;
      }
      @keyframes line-expand {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
    </style>
  </defs>

  <!-- SHELBY -->
  <text id='logo-text' x='64' y='18'
    text-anchor='middle'
    font-family='Nunito Sans, sans-serif'
    font-weight='300'
    font-size='19'
    letter-spacing='7'
    class='logo-color'>SHELBY</text>

  <!-- line — endpoints set by JS -->
  <line id='logo-line' class='line'
    x1='0' y1='25' x2='125' y2='25'
    stroke-width='1.1'/>

  <!-- rect cutout over line inside v -->
  <rect x='53' y='23.8' width='19' height='2.5' style='fill: var(--bs-navbar-bg, white);'/>

  <!-- LE -->
  <text x='33' y='46'
    text-anchor='middle'
    font-family='Nunito Sans, sans-serif'
    font-weight='300'
    font-size='19'
    letter-spacing='7'
    class='logo-color'>LE</text>

  <!-- v drawn last to sit on top -->
  <text x='62.5' y='49'
    text-anchor='middle'
    font-family='Montserrat, sans-serif'
    font-weight='200'
    font-size='34'
    class='logo-color'>V</text>

  <!-- EL -->
  <text x='100' y='46'
    text-anchor='middle'
    font-family='Nunito Sans, sans-serif'
    font-weight='300'
    font-size='19'
    letter-spacing='7'
    class='logo-color'>EL</text>

  <script>
    window.addEventListener('load', function() {
      const text = document.getElementById('logo-text');
      const line = document.getElementById('logo-line');
      const length = text.getComputedTextLength();
      const cx = 62.5; // text anchor x
      line.setAttribute('x1', cx - length / 2);
      line.setAttribute('x2', cx + length / 2);
    });
  </script>

</svg>